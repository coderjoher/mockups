<!doctype html><html><head><meta charset="utf-8"><title>Lazy fixture</title>
<style>body{margin:0} #lazy{height:400px;background:#ffffff} #lazy.loaded{background:#ff0000} .spacer{height:4000px;background:#eeeeee}</style>
</head><body><div class="spacer"></div><div id="lazy"></div>
<script>
  // Content only appears once scrolled into view, like lazy images.
  new IntersectionObserver((entries) => entries.forEach((e) => e.isIntersecting && e.target.classList.add('loaded'))).observe(document.getElementById('lazy'));
</script></body></html>
