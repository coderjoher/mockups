name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/mockups
      REDIS_URL: redis://127.0.0.1:6379
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: workers/render/requirements.txt }
      - name: Install dependencies
        run: |
          npm ci
          pip install -r workers/render/requirements.txt
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y ffmpeg fontconfig
          sudo scripts/install-fonts.sh
      - name: Create databases
        run: |
          for db in mockups mockups_test mockups_e2e; do psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE $db"; done
      - name: Typecheck
        run: npm run typecheck
      - name: Phase gate (requirement coverage + unit/integration + Python + E2E)
        run: scripts/phase-gate.sh "$(cat docs/PHASE)"
      - name: Coverage
        run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }
